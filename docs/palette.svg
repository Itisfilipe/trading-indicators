<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="300" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <g font-size="13" fill="#374151">
    <rect x="24" y="24" width="36" height="28" rx="4" fill="#5B9CF5" stroke="#2F6FD0"/>
    <text x="72" y="38">Up body</text><text x="72" y="52" fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#5B9CF5</text>

    <rect x="24" y="64" width="36" height="28" rx="4" fill="#2F6FD0"/>
    <text x="72" y="78">Up outline + wick</text><text x="72" y="92" fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#2F6FD0</text>

    <rect x="24" y="104" width="36" height="28" rx="4" fill="#969BA4" stroke="#6B7280"/>
    <text x="72" y="118">Down body</text><text x="72" y="132" fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#969BA4</text>

    <rect x="24" y="144" width="36" height="28" rx="4" fill="#6B7280"/>
    <text x="72" y="158">Down outline + wick, crosshair</text><text x="72" y="172" fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#6B7280</text>

    <rect x="24" y="184" width="36" height="28" rx="4" fill="#374151"/>
    <text x="72" y="198">Text, strong lines</text><text x="72" y="212" fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#374151</text>

    <rect x="24" y="224" width="36" height="28" rx="4" fill="#D1D5DB"/>
    <text x="72" y="238">Scale line, faint lines</text><text x="72" y="252" fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#D1D5DB</text>

    <rect x="24" y="264" width="36" height="22" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="72" y="280">Background <tspan fill="#6B7280" font-family="ui-monospace, Menlo, Consolas, monospace">#FFFFFF</tspan></text>
  </g>

  <g transform="translate(330 24)">
    <rect width="366" height="252" fill="#FFFFFF" stroke="#E5E7EB"/>
    <line x1="0" y1="96" x2="366" y2="96" stroke="#374151" stroke-width="2"/>
    <line x1="0" y1="176" x2="366" y2="176" stroke="#6B7280"/>
    <line x1="0" y1="56" x2="366" y2="56" stroke="#969BA4" stroke-dasharray="5 4"/>
    <line x1="0" y1="136" x2="366" y2="136" stroke="#969BA4" stroke-dasharray="5 4"/>
    <line x1="0" y1="216" x2="366" y2="216" stroke="#969BA4" stroke-dasharray="5 4"/>

    <g stroke-width="1.5">
      <line x1="30" y1="150" x2="30" y2="210" stroke="#2F6FD0"/><rect x="22" y="160" width="16" height="40" fill="#5B9CF5" stroke="#2F6FD0"/>
      <line x1="64" y1="120" x2="64" y2="175" stroke="#2F6FD0"/><rect x="56" y="130" width="16" height="36" fill="#5B9CF5" stroke="#2F6FD0"/>
      <line x1="98" y1="112" x2="98" y2="165" stroke="#6B7280"/><rect x="90" y="126" width="16" height="28" fill="#969BA4" stroke="#6B7280"/>
      <line x1="132" y1="88" x2="132" y2="160" stroke="#2F6FD0"/><rect x="124" y="98" width="16" height="50" fill="#5B9CF5" stroke="#2F6FD0"/>
      <line x1="166" y1="70" x2="166" y2="122" stroke="#2F6FD0"/><rect x="158" y="80" width="16" height="30" fill="#5B9CF5" stroke="#2F6FD0"/>
      <line x1="200" y1="66" x2="200" y2="140" stroke="#6B7280"/><rect x="192" y="80" width="16" height="48" fill="#969BA4" stroke="#6B7280"/>
      <line x1="234" y1="110" x2="234" y2="182" stroke="#6B7280"/><rect x="226" y="122" width="16" height="44" fill="#969BA4" stroke="#6B7280"/>
      <line x1="268" y1="128" x2="268" y2="190" stroke="#2F6FD0"/><rect x="260" y="140" width="16" height="30" fill="#5B9CF5" stroke="#2F6FD0"/>
      <line x1="302" y1="100" x2="302" y2="150" stroke="#2F6FD0"/><rect x="294" y="108" width="16" height="34" fill="#5B9CF5" stroke="#2F6FD0"/>
      <line x1="336" y1="92" x2="336" y2="132" stroke="#6B7280"/><rect x="328" y="102" width="16" height="20" fill="#969BA4" stroke="#6B7280"/>
    </g>

    <line x1="200" y1="0" x2="200" y2="252" stroke="#6B7280" stroke-dasharray="3 3"/>
    <line x1="0" y1="104" x2="366" y2="104" stroke="#6B7280" stroke-dasharray="3 3"/>
  </g>
</svg>
