      <line x1="98" y1="112" x2="98" y2="165" stroke="#5F6773"/><rect x="90" y="126" width="16" height="28" fill="#8F959E" stroke="#5F6773"/>
      <line x1="132" y1="88" x2="132" y2="160" stroke="#3E68A3"/><rect x="124" y="98" width="16" height="50" fill="#6995D3" stroke="#3E68A3"/>
      <line x1="166" y1="70" x2="166" y2="122" stroke="#3E68A3"/><rect x="158" y="80" width="16" height="30" fill="#6995D3" stroke="#3E68A3"/>
      <line x1="200" y1="66" x2="200" y2="140" stroke="#5F6773"/><rect x="192" y="80" width="16" height="48" fill="#8F959E" stroke="#5F6773"/>
      <line x1="234" y1="110" x2="234" y2="182" stroke="#5F6773"/><rect x="226" y="122" width="16" height="44" fill="#8F959E" stroke="#5F6773"/>
      <line x1="268" y1="128" x2="268" y2="190" stroke="#3E68A3"/><rect x="260" y="140" width="16" height="30" fill="#6995D3" stroke="#3E68A3"/>
      <line x1="302" y1="100" x2="302" y2="150" stroke="#3E68A3"/><rect x="294" y="108" width="16" height="34" fill="#6995D3" stroke="#3E68A3"/>
      <line x1="336" y1="92" x2="336" y2="132" stroke="#5F6773"/><rect x="328" y="102" width="16" height="20" fill="#8F959E" stroke="#5F6773"/>
    </g>

    <line x1="200" y1="0" x2="200" y2="292" stroke="#5F6773" stroke-dasharray="3 3"/>
    <line x1="0" y1="104" x2="366" y2="104" stroke="#5F6773" stroke-dasharray="3 3"/>
