    <line x1="0" y1="176" x2="366" y2="176" stroke="#5F6773"/>
    <line x1="0" y1="56" x2="366" y2="56" stroke="#8F959E" stroke-dasharray="5 4"/>
    <line x1="0" y1="136" x2="366" y2="136" stroke="#8F959E" stroke-dasharray="5 4"/>
    <line x1="0" y1="216" x2="366" y2="216" stroke="#8F959E" stroke-dasharray="5 4"/>

