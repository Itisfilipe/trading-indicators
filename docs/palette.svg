    <text x="72" y="238">Scale line, faint lines</text><text x="72" y="252" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#D1D5DB</text>

    <rect x="24" y="264" width="36" height="28" rx="4" fill="#B8862B" fill-opacity="0.12" stroke="#B8862B"/>
    <text x="72" y="278">Zones (rectangles), 12% fill</text><text x="72" y="292" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#B8862B</text>

    <rect x="24" y="304" width="36" height="22" rx="4" fill="#F8F9FB" stroke="#D1D5DB"/>
