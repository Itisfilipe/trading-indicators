    <text x="72" y="38">Up body</text><text x="72" y="52" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#6995D3</text>

    <rect x="24" y="64" width="36" height="28" rx="4" fill="#3E68A3"/>
    <text x="72" y="78">Up outline + wick</text><text x="72" y="92" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#3E68A3</text>

    <rect x="24" y="104" width="36" height="28" rx="4" fill="#8F959E" stroke="#5F6773"/>
    <text x="72" y="118">Down body</text><text x="72" y="132" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#8F959E</text>

    <rect x="24" y="144" width="36" height="28" rx="4" fill="#5F6773"/>
    <text x="72" y="158">Down outline + wick, crosshair</text><text x="72" y="172" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#5F6773</text>

    <rect x="24" y="184" width="36" height="28" rx="4" fill="#374151"/>
    <text x="72" y="198">Text, strong lines</text><text x="72" y="212" fill="#5F6773" font-family="ui-monospace, Menlo, Consolas, monospace">#374151</text>

