<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="340" rx="10" fill="#F8F9FB" stroke="#E5E7EB"/>

  <g font-size="13" fill="#374151">
